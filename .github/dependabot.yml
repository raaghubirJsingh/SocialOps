# SocialOps - Dependabot configuration (AGENTS.md sections 5.6, 12, 15)
# Locked scope: npm dependencies and GitHub Actions dependencies only.
# Weekly cadence. Free / private-repo-compatible. No GHAS / CodeQL / paid services.
# Server-side: becomes active after the remote + push approval gate (AGENTS.md section 15).
version: 2

updates:
  # npm workspace root (plain npm workspaces; single root package-lock.json covers all workspaces)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # GitHub Actions used by .github/workflows/ci.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "ci"